<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Parfum by Arif</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --card: #16161a;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --text: #f5f5f7;
      --muted: #a6a6b0;
      --border: #282830;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 16px;
      text-align: center;
      background: linear-gradient(180deg, #151411 0%, var(--bg) 100%);
    }
    .brand {
      font-size: 23px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .notice {
      background: var(--gold-soft);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      color: #f3dfb0;
      text-align: center;
      padding: 9px 14px;
      font-size: 13px;
    }
    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .search-input:focus { border-color: var(--gold); }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .filter-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .thumb {
      width: 100%;
      height: 185px;
      object-fit: cover;
      display: block;
      background: #101014;
      border-bottom: 1px solid var(--border);
    }
    .body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .cat-tag {
      display: inline-block;
      font-size: 11px;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stars-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      padding: 7px 8px;
      background: #101014;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stars {
      display: flex;
      gap: 3px;
    }
    .star-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #4a4a55;
      line-height: 1;
      padding: 0 1px;
    }
    .star-btn.active { color: #ffd43b; }
    .score-text {
      font-size: 12px;
      color: #ffd43b;
      font-weight: 600;
      white-space: nowrap;
    }
    .price {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--gold);
      color: #111;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 22px 16px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <header>
      <div class="brand" style="display:flex;align-items:center;justify-content:center;">
    <svg viewBox="0 0 420 92" ...>
      <defs>
        <linearGradient id="miGold" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b8891e" />
          <stop offset="50%" stop-color="#f5d77f" />
          <stop offset="100%" stop-color="#c99a2e" />
        </linearGradient>
      </defs>
      <text x="12" y="54" fill="url(#miGold)" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="2">Mi</text>
                  <g transform="translate(114,10)">
        <defs>
          <linearGradient id="miGoldRich" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe89e" />
            <stop offset="40%" stop-color="#d4af37" />
            <stop offset="70%" stop-color="#b8891e" />
            <stop offset="100%" stop-color="#734e08" />
          </linearGradient>
          <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <path d="M27 24 C14 5, -5 6, 1 20 C5 29, 17 28, 27 25.5 Z" fill="none" stroke="url(#miGoldRich)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
        <path d="M27 24.5 C40 5, 59 6, 53 20 C49 29, 37 28, 27 25.5 Z" fill="none" stroke="url(#miGoldRich)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
        <path d="M27 26.5 C15 28.5, 5.5 39, 13 48 C19 54, 25 43, 27 29 Z" fill="none" stroke="url(#miGoldRich)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
        <path d="M27 26.5 C39 28.5, 48.5 39, 41 48 C35 54, 29 43, 27 29 Z" fill="none" stroke="url(#miGoldRich)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
        <path d="M27 18.5 Q22 8 16 10 C14.5 10.5 14.5 12.5 16.5 12.5 Q18.5 12.5 21 16.5 Z" fill="none" stroke="url(#miGoldRich)" stroke-width="1.8" stroke-linecap="round" />
        <path d="M27 18.5 Q32 8 38 10 C39.5 10.5 39.5 12.5 37.5 12.5 Q35.5 12.5 33 16.5 Z" fill="none" stroke="url(#miGoldRich)" stroke-width="1.8" stroke-linecap="round" />
        <ellipse cx="27" cy="30.5" rx="2.4" ry="14" fill="url(#miGoldRich)" filter="url(#goldGlow)" />
                  </g>
      
        <path d="M27 24 C17 4, -3 2, 1 20 C3 29, 15 30, 26 26 Z" fill="url(#wingGrad)" fill-opacity="0.22" stroke="url(#miGold)" stroke-width="2.2" stroke-linejoin="round" />
        <path d="M26 27 C14 29, 5 42, 14 49 C20 53, 25 41, 27 28 Z" fill="url(#wingGrad)" fill-opacity="0.18" stroke="url(#miGold)" stroke-width="2.1" stroke-linejoin="round" />
        <path d="M27 24 C37 4, 57 2, 53 20 C51 29, 39 30, 28 26 Z" fill="url(#wingGrad)" fill-opacity="0.22" stroke="url(#miGold)" stroke-width="2.2" stroke-linejoin="round" />
        <path d="M28 27 C40 29, 49 42, 40 49 C34 53, 29 41, 27 28 Z" fill="url(#wingGrad)" fill-opacity="0.18" stroke="url(#miGold)" stroke-width="2.1" stroke-linejoin="round" />
        <path d="M23 22 C15 12, 6 12, 8 20" fill="none" stroke="url(#miGold)" stroke-width="1.3" stroke-linecap="round" />
        <path d="M31 22 C39 12, 48 12, 46 20" fill="none" stroke="url(#miGold)" stroke-width="1.3" stroke-linecap="round" />
        <ellipse cx="27" cy="31" rx="2.1" ry="13" fill="url(#miGold)" />
        <path d="M26 18 C21 8, 15 6, 12 9" fill="none" stroke="url(#miGold)" stroke-width="1.7" stroke-linecap="round" />
        <path d="M28 18 C33 8, 39 6, 42 9" fill="none" stroke="url(#miGold)" stroke-width="1.7" stroke-linecap="round" />
        <circle cx="12" cy="9" r="1.5" fill="#f7df8b" />
        <circle cx="42" cy="9" r="1.5" fill="#f7df8b" />
            </g>
      
      <line x1="14" y1="63" x2="365" y2="63" stroke="url(#miGold)" stroke-width="2.2" />
      <text x="14" y="83" fill="#f3dfb0" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="5">PARFUM</text>
      <text x="155" y="82" fill="#d4af37" font-family="Arial, sans-serif" font-size="15" font-style="italic">by Arif</text>
    </svg>
  </div>
  <div class="subtitle">Bir Qoxu Bir İmza</div>
    
  </header>

  <div class="notice">
    Qapıda <strong>nağd ödəniş</strong> • Sifarişlər birbaşa WhatsApp ilə qəbul olunur
  </div>

  <div class="container">
    <input
      type="text"
      id="searchBox"
      class="search-input"
      placeholder="Ətir və ya gümüş axtarın..."
      oninput="render()"
    />

    <div class="filters">
      <button class="filter-btn active" onclick="setCat('Hamısı', this)">Hamısı</button>
      <button class="filter-btn" onclick="setCat('Yağ Ətirlər', this)">Yağ Ətirlər</button>
      <button class="filter-btn" onclick="setCat('Qutu Ətirlər', this)">Qutu Ətirlər</button>
      <button class="filter-btn" onclick="setCat('Gümüş', this)">Gümüş</button>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <footer>
      <p><strong>Mi Parfum by Arif</strong> • Bir Qoxu Bir İmza</p>
    
  </footer>

  <script>
    const WHATSAPP_NUMBER = "994998997455";

    // Şəkil adını bu formada verin:
    // Yag-25AZN-Oud Wood-Qaliciliq ela.jpg
    // Qutu-55AZN-Sauvage-Orijinal qutu.jpg
    // Gumus-40AZN-Gumus uzuk-925 eyar.jpg
    const AUTO_IMAGES = [
      "Yag-25AZN-Oud Wood-Qaliciliq ve şleyf ela.jpg",
      "Qutu-50AZN-Secilmis Etir-Hediyyelik qutu.jpg",
      "Gumus-40AZN-Gumus Model-Zovqlu dizayn.jpg"
    ];

    // İstəsəniz bura da qısa əlavə edə bilərsiniz (şəkil yükləmədən)
    const MANUAL_ITEMS = [];

    let currentCat = "Hamısı";

    function parseImageName(filename) {
      const clean = decodeURIComponent(filename.split("/").pop().replace(/\.[^/.]+$/, ""));
      const parts = clean.split("-");
      const prefix = (parts[0] || "").trim().toLowerCase();

      let category = "Yağ Ətirlər";
      if (prefix.startsWith("qutu")) category = "Qutu Ətirlər";
      else if (prefix.startsWith("gumus") || prefix.startsWith("gümüş")) category = "Gümüş";
      else if (prefix.startsWith("yag") || prefix.startsWith("yağ")) category = "Yağ Ətirlər";

      let price = "Razılaşma ilə";
      let name = "Məhsul";
      let desc = "";

      if (parts.length >= 3) {
        const rawPrice = parts[1].trim();
        price = /azn/i.test(rawPrice) ? rawPrice : `${rawPrice} AZN`;
        name = parts[2].trim();
        desc = parts.slice(3).join("-").trim();
      } else {
        name = clean;
      }

      return { id: filename, name, category, price, desc, img: filename };
    }

    function getRatingsMap() {
      try {
        return JSON.parse(localStorage.getItem("miparfum_stars") || "{}");
      } catch {
        return {};
      }
    }

    function setStar(id, starVal) {
      const map = getRatingsMap();
      map[id] = starVal;
      localStorage.setItem("miparfum_stars", JSON.stringify(map));
      render();
    }

    function setCat(cat, btn) {
      currentCat = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    function render() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const allItems = [
        ...AUTO_IMAGES.map(parseImageName),
        ...MANUAL_ITEMS
      ];
      const ratings = getRatingsMap();

      const list = allItems.filter(item => {
        const okCat = currentCat === "Hamısı" || item.category === currentCat;
        const okText =
          !q ||
          item.name.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        return okCat && okText;
      });

      const grid = document.getElementById("grid");
      if (!list.length) {
        grid.innerHTML = `<p style="color:var(--muted);">Məhsul tapılmadı.</p>`;
        return;
      }

      grid.innerHTML = list.map(item => {
        const star = ratings[item.id] || 0;
        const starText = star ? `${star}/5 ★` : "Ulduz ver";
        const msg = encodeURIComponent(
          `Salam! "${item.name}" (${item.price}) sifariş etmək istəyirəm${star ? ` | Qiymət: ${star} ulduz` : ""}. Ödəniş: Qapıda nağd.`
        );
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

        const starsHtml = [1, 2, 3, 4, 5].map(n =>
          `<button class="star-btn ${n <= star ? "active" : ""}" onclick="setStar('${item.id.replace(/'/g, "\\'")}', ${n})" title="${n} ulduz">★</button>`
        ).join("");

        return `
          <div class="card">
            <img class="thumb" src="${item.img}" alt="${item.name}" onerror="this.style.display='none'" />
            <div class="body">
              <div>
                <span class="cat-tag">${item.category}</span>
                <div class="title">${item.name}</div>
                ${item.desc ? `<div class="desc">${item.desc}</div>` : ""}
              </div>
              <div>
                <div class="stars-row">
                  <div class="stars">${starsHtml}</div>
                  <span class="score-text">${starText}</span>
                </div>
                <div class="price">${item.price}</div>
                <a class="btn" href="${waUrl}" target="_blank" rel="noopener">Nağd sifariş et (WhatsApp)</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    render();
  </script>
</body>
</html>
